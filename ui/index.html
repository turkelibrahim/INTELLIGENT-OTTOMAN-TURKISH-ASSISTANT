<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCR Correction Studio</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="studio-header">
        <div class="logo">
            <i class="fa-solid fa-pen-nib"></i> OCR Correction Studio
        </div>
        <div class="actions">
            <button id="save-btn" class="btn primary"><i class="fa-solid fa-save"></i> Dışa Aktar (JSON)</button>
        </div>
    </header>

    <main class="studio-container">
        <!-- Left Panel: Image Viewer -->
        <section class="panel image-panel">
            <div class="panel-header">
                <h3>Orijinal Belge Görseli</h3>
                <div class="zoom-controls">
                    <button id="zoom-in" title="Zoom In"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
                    <button id="zoom-out" title="Zoom Out"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
                    <button id="zoom-reset" title="Reset"><i class="fa-solid fa-expand"></i></button>
                </div>
            </div>
            <div class="canvas-container" id="canvas-container">
                <canvas id="doc-canvas"></canvas>
            </div>
        </section>

        <!-- Right Panel: Text Editor -->
        <section class="panel text-panel">
            <div class="panel-header">
                <h3>OCR Metin Düzenleyici</h3>
                <span id="line-count" class="badge">0 Satır</span>
            </div>
            <div class="editor-container" id="editor-container" dir="rtl">
                <!-- Lines will be injected here via JS -->
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
